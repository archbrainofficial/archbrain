<!DOCTYPE html>
<html>
<head>
    <title>Test Signup</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 50px auto; background: #0B1320; color: white; }
        .form { background: #151F3D; padding: 20px; border-radius: 10px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #EF476F; background: #101827; color: white; }
        button { width: 100%; padding: 12px; background: #EF476F; color: black; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; background: #1F2A44; border-radius: 8px; display: none; }
        .success { background: #1e7f5e; }
        .error { background: #7f1e1e; }
    </style>
</head>
<body>
    <div class="form">
        <h2>Test Signup</h2>
        <input id="name" placeholder="Full Name" value="Test User">
        <input id="email" placeholder="Email" value="testuser@example.com">
        <input id="phone" placeholder="Phone" value="1234567890">
        <input id="password" type="password" placeholder="Password" value="password123">
        <button onclick="signup()">Sign Up</button>
    </div>
    <div id="result" class="result"></div>

    <script>
        async function signup() {
            const result = document.getElementById('result');
            result.style.display = 'block';
            result.innerHTML = '<p>Loading...</p>';
            
            try {
                const response = await fetch('http://localhost:3005/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('name').value,
                        email: document.getElementById('email').value,
                        phone: document.getElementById('phone').value,
                        password: document.getElementById('password').value,
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    result.className = 'result success';
                    result.innerHTML = `<strong>✓ Signup Successful!</strong><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    result.className = 'result error';
                    result.innerHTML = `<strong>✗ Signup Failed</strong><pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                result.className = 'result error';
                result.innerHTML = `<strong>✗ Error:</strong><pre>${error.message}</pre>`;
            }
        }
    </script>
</body>
</html>
